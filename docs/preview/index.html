    &quot;message&quot;,
    (event) =&gt; {

        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

      const name=signal===&#x27;program&#x27;?&#x27;simulated test pattern&#x27;:signal===&#x27;black&#x27;?&#x27;black picture&#x27;:&#x27;no signal&#x27;;
      return `&lt;div class=&quot;th-feed&quot; data-signal=&quot;${signal}&quot; role=&quot;img&quot; aria-label=&quot;${name} on SDI input ${c.id}&quot;&gt;
        ${signal===&#x27;program&#x27;?&#x27;&lt;div class=&quot;th-colorbars&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}
        &lt;span class=&quot;th-feed-kicker&quot;&gt;SDI ${String(c.id).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;
        ${signal!==&#x27;program&#x27;?`&lt;div class=&quot;th-feed-center&quot;&gt;&lt;span class=&quot;th-feed-title&quot;&gt;${signal===&#x27;black&#x27;?&#x27;BLACK&#x27;:&#x27;NO SIGNAL&#x27;}&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}
        &lt;div class=&quot;th-feed-bottom&quot;&gt;&lt;span&gt;${signal===&#x27;nosignal&#x27;?&#x27;Input not locked&#x27;:escape(c.format||&#x27;525i / 59.94&#x27;)}&lt;/span&gt;&lt;span&gt;${signal===&#x27;program&#x27;?&#x27;SIMULATED SOURCE&#x27;:signal===&#x27;black&#x27;?&#x27;VALID SDI · SILENCE&#x27;:&#x27;CHECK INPUT&#x27;}&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;`;
    }
    function channelCard(c,i) {
      const [label,tone]=status(c),j=c.job;
      const remaining=j?.state===&#x27;recording&#x27;?timer(j.duration-j.recorded):j?.state===&#x27;waiting&#x27;?&#x27;Waiting&#x27;:j?.state===&#x27;prepared&#x27;?timer(j.duration):&#x27;—&#x27;;
      return `&lt;button type=&quot;button&quot; class=&quot;th-channel cursor-interaction&quot; data-action=&quot;select-channel&quot; data-channel=&quot;${i}&quot; aria-pressed=&quot;${state.selected===i}&quot; aria-label=&quot;Channel ${c.id}, ${escape(c.deck)}, ${label}&quot;&gt;
        &lt;div class=&quot;th-channel-top&quot;&gt;&lt;div class=&quot;th-channel-title&quot;&gt;&lt;strong&gt;${String(c.id).padStart(2,&#x27;0&#x27;)} · ${escape(c.deck)}&lt;/strong&gt;${tag(label,tone)}&lt;/div&gt;&lt;/div&gt;
        ${feed(c)}
        &lt;div class=&quot;th-channel-bottom&quot;&gt;&lt;div class=&quot;th-mini-time&quot;&gt;&lt;span&gt;${escape(j?.name||c.format)}&lt;/span&gt;&lt;strong class=&quot;th-num&quot;&gt;${remaining}&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/button&gt;`;
    }
    function scopePanel() {
      const scopeSignal = state.view === &#x27;qc&#x27; ? &#x27;program&#x27; : selected().signal;
      return `&lt;div class=&quot;th-scope&quot;&gt;&lt;div class=&quot;th-scope-head&quot;&gt;&lt;span class=&quot;th-label&quot;&gt;${state.view===&#x27;qc&#x27;?&#x27;Review scopes&#x27;:&#x27;Live scopes&#x27;}&lt;/span&gt;&lt;div class=&quot;th-tabs&quot; aria-label=&quot;Scope view&quot;&gt;${[[&#x27;waveform&#x27;,&#x27;Waveform&#x27;],[&#x27;vectorscope&#x27;,&#x27;Vectorscope&#x27;],[&#x27;audio&#x27;,&#x27;Audio&#x27;]].map(([v,t])=&gt;`&lt;button type=&quot;button&quot; class=&quot;th-tab cursor-interaction&quot; aria-pressed=&quot;${state.scope===v}&quot; data-action=&quot;scope&quot; data-scope=&quot;${v}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;canvas data-scope-canvas role=&quot;img&quot; aria-label=&quot;Illustrative ${state.scope} for the selected simulated input&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;th-small&quot; style=&quot;margin-top:6px&quot;&gt;${scopeSignal===&#x27;nosignal&#x27;?&#x27;No valid input&#x27;:scopeSignal===&#x27;black&#x27;?&#x27;Black picture · audio below −50 dBFS&#x27;:&#x27;Illustrative source scopes · 48 kHz embedded audio&#x27;}&lt;/div&gt;&lt;/div&gt;`;
    }
    function captureEditor() {
      const c=selected(),j=c.job,d=c.draft;
      const fieldHeader=`&lt;div class=&quot;th-panel-head&quot;&gt;&lt;div class=&quot;th-row th-between&quot;&gt;&lt;h2&gt;${j?&#x27;Recording job&#x27;:&#x27;Prepare a recording&#x27;}&lt;/h2&gt;&lt;span class=&quot;th-tag&quot;&gt;CH ${String(c.id).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;th-small&quot;&gt;${escape(c.deck)} · ${escape(c.format)}&lt;/span&gt;&lt;/div&gt;`;
      if(j) {
        const recording=j.state===&#x27;recording&#x27;, waiting=j.state===&#x27;waiting&#x27;, prepared=j.state===&#x27;prepared&#x27;,complete=j.state===&#x27;complete&#x27;;
        return `&lt;section class=&quot;th-panel&quot;&gt;${fieldHeader}&lt;div class=&quot;th-panel-body&quot;&gt;&lt;div class=&quot;th-row th-between&quot;&gt;&lt;span class=&quot;th-label&quot;&gt;${recording?&#x27;Recording to local cache&#x27;:waiting?&#x27;Armed for content&#x27;:prepared?&#x27;Ready when you are&#x27;:&#x27;Capture saved locally&#x27;}&lt;/span&gt;${tag(status(c)[0],status(c)[1])}&lt;/div&gt;&lt;strong style=&quot;overflow-wrap:anywhere&quot;&gt;${escape(j.name)}&lt;/strong&gt;&lt;div&gt;&lt;div class=&quot;th-timer th-num ${recording?&#x27;th-recording-time&#x27;:&#x27;&#x27;}&quot;&gt;${recording?timer(j.duration-j.recorded):waiting?timer(j.waited):complete?timer(j.recorded):timer(j.duration)}&lt;/div&gt;&lt;div class=&quot;th-small th-center&quot;&gt;${recording?&#x27;remaining&#x27;:waiting?&#x27;waiting for a new content transition&#x27;:complete?&#x27;recorded duration&#x27;:`${Math.round(j.duration/60)} minute recording`}&lt;/div&gt;&lt;/div&gt;${recording?progress(j.recorded/j.duration*100,&#x27;Recording duration&#x27;):&#x27;&#x27;}${j.endingWarning?`&lt;div class=&quot;th-note&quot; data-tone=&quot;warning&quot;&gt;${icon(&#x27;triangle-alert&#x27;)}&lt;span&gt;Suspected tape ending${j.graceLeft!==null?` · stopping in ${j.graceLeft}s`:&#x27; · review extended black and silence&#x27;}. ${j.endMode===&#x27;alert&#x27;?&#x27;Recording continues to the timer.&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}${c.signal===&#x27;nosignal&#x27;?`&lt;div class=&quot;th-note&quot; data-tone=&quot;warning&quot;&gt;${icon(&#x27;unplug&#x27;)}&lt;span&gt;Input signal lost. Capture status is flagged for review.&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}${prepared?button(`${icon(&#x27;play&#x27;)} START RECORDING`,&#x27;start&#x27;,&#x27;th-primary th-big-start&#x27;):&#x27;&#x27;}${waiting?`&lt;div class=&quot;th-note&quot;&gt;${icon(&#x27;radar&#x27;)}&lt;span&gt;Starts after 2 seconds of valid program content. Includes ${j.preRoll}s of pre-roll.&lt;/span&gt;&lt;/div&gt;${button(`${icon(&#x27;play&#x27;)} Start now`,&#x27;start&#x27;,&#x27;th-primary&#x27;)}${button(&#x27;Cancel waiting&#x27;,&#x27;cancel-wait&#x27;,&#x27;th-quiet&#x27;)}`:&#x27;&#x27;}${recording?`&lt;div class=&quot;th-fields-two&quot;&gt;${button(`${icon(&#x27;square&#x27;)} Stop and save`,&#x27;stop&#x27;,&#x27;th-danger&#x27;)}${button(&#x27;+ 5 minutes&#x27;,&#x27;add-time&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}${complete?`&lt;div class=&quot;th-note&quot; data-tone=&quot;success&quot;&gt;${icon(&#x27;file-check-2&#x27;)}&lt;span&gt;${escape(j.reason)} · package ${j.warning?&#x27;held for review&#x27;:&#x27;queued for delivery&#x27;}.&lt;/span&gt;&lt;/div&gt;${button(`${icon(&#x27;plus&#x27;)} Prepare next tape`,&#x27;next-tape&#x27;,&#x27;th-primary&#x27;)}`:&#x27;&#x27;}&lt;div class=&quot;th-divider&quot;&gt;&lt;/div&gt;&lt;div class=&quot;th-job-meta&quot;&gt;${jobMetadataSummary(j)}&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span class=&quot;th-muted&quot;&gt;Profile&lt;/span&gt;&lt;span&gt;${escape(j.profile)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span class=&quot;th-muted&quot;&gt;End detection&lt;/span&gt;&lt;span&gt;${!j.experimentalEndDetection?&#x27;Off (experimental)&#x27;:j.endMode===&#x27;stop&#x27;?&#x27;Automatic stop&#x27;:j.endMode===&#x27;off&#x27;?&#x27;Disabled for this job&#x27;:&#x27;Alert only (experimental)&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span class=&quot;th-muted&quot;&gt;Local cache&lt;/span&gt;&lt;span&gt;D:\\DeckCapture&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;th-field&quot;&gt;&lt;span&gt;Deliver to&lt;/span&gt;&lt;span class=&quot;th-path&quot;&gt;${escape(path(j.destination,j.folder))}&lt;/span&gt;&lt;/div&gt;${prepared?button(&#x27;Edit job details&#x27;,&#x27;edit-job&#x27;,&#x27;th-quiet&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;/section&gt;`;
      }
      return `&lt;section class=&quot;th-panel&quot;&gt;${fieldHeader}&lt;form data-recording-form class=&quot;th-panel-body&quot;&gt;${input(&#x27;File name&#x27;,&#x27;draft.name&#x27;,d.name,&#x27;text&#x27;,&#x27;required maxlength=&quot;100&quot; autocomplete=&quot;off&quot;&#x27;)}${captureMetadataForm(d)}&lt;div class=&quot;th-field&quot;&gt;&lt;span&gt;Record duration&lt;/span&gt;&lt;div class=&quot;th-presets&quot;&gt;${state.settings.durations.split(&#x27;,&#x27;).map(x=&gt;Number(x.trim())).filter(x=&gt;x&gt;0&amp;&amp;x&lt;=720).map(m=&gt;`&lt;button type=&quot;button&quot; class=&quot;th-preset cursor-interaction&quot; data-action=&quot;preset&quot; data-minutes=&quot;${m}&quot; aria-pressed=&quot;${Number(d.duration)===m}&quot;&gt;${m} min&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;label class=&quot;th-small&quot;&gt;Custom minutes &lt;input style=&quot;width:72px;margin-left:5px;padding:5px;border:1px solid var(--th-line);border-radius:5px;color:var(--th-text);background:var(--th-panel)&quot; aria-label=&quot;Custom recording duration in minutes&quot; data-field=&quot;draft.duration&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;720&quot; value=&quot;${escape(d.duration)}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;th-divider&quot;&gt;&lt;/div&gt;${select(&#x27;Delivery destination&#x27;,&#x27;draft.destination&#x27;,d.destination,[[&#x27;KGAN&#x27;,&#x27;Station archive / KGAN&#x27;],[&#x27;KFXA&#x27;,&#x27;Station archive / KFXA&#x27;],[&#x27;Mixed&#x27;,&#x27;Station archive / Mixed stations&#x27;]])}&lt;div class=&quot;th-field&quot;&gt;&lt;div class=&quot;th-row th-between&quot;&gt;&lt;span&gt;Archive folder&lt;/span&gt;${button(`${icon(&#x27;folder-open&#x27;)} Browse`,&#x27;browse&#x27;,&#x27;th-quiet&#x27;)}&lt;/div&gt;&lt;span class=&quot;th-path&quot;&gt;${escape(path(d.destination,d.folder))}&lt;/span&gt;&lt;/div&gt;${select(&#x27;Capture profile&#x27;,&#x27;draft.profile&#x27;,d.profile,[&#x27;FFV1 / MKV&#x27;,&#x27;Uncompressed / MOV&#x27;])}${endDetectionControl(d)}&lt;div class=&quot;th-save-actions&quot;&gt;${button(`${icon(&#x27;check&#x27;)} Save and prepare`,&#x27;prepare&#x27;,&#x27;th-primary&#x27;)}${button(`${icon(&#x27;radar&#x27;)} Save and wait for content`,&#x27;arm&#x27;)}&lt;/div&gt;&lt;div class=&quot;th-small&quot;&gt;Records to local storage first. Network delivery follows the transfer schedule.&lt;/div&gt;&lt;/form&gt;&lt;/section&gt;`;
    }
    function demoControls() {
      const c=selected();
      return `&lt;div class=&quot;th-demo&quot; aria-label=&quot;Preview simulation controls&quot;&gt;&lt;div class=&quot;th-row&quot;&gt;&lt;span class=&quot;th-demo-label&quot;&gt;Simulation controls&lt;/span&gt;&lt;label class=&quot;th-row th-small&quot;&gt;CH ${String(c.id).padStart(2,&#x27;0&#x27;)} input &lt;select aria-label=&quot;Simulated input&quot; data-field=&quot;signal&quot;&gt;&lt;option value=&quot;program&quot; ${c.signal===&#x27;program&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Program content&lt;/option&gt;&lt;option value=&quot;black&quot; ${c.signal===&#x27;black&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Black + silence&lt;/option&gt;&lt;option value=&quot;nosignal&quot; ${c.signal===&#x27;nosignal&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;No signal&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;th-row&quot;&gt;&lt;select aria-label=&quot;Simulation time step&quot; data-field=&quot;step&quot;&gt;${[[2,&#x27;2 seconds&#x27;],[120,&#x27;2 minutes&#x27;],[600,&#x27;10 minutes&#x27;],[43200,&#x27;12 hours&#x27;]].map(([v,t])=&gt;`&lt;option value=&quot;${v}&quot; ${state.step===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${t}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;${button(`${icon(&#x27;fast-forward&#x27;)} Advance`,&#x27;advance&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
    }
    function inputRows() {
      return `&lt;section class=&quot;th-input-table&quot; aria-label=&quot;SDI input channels&quot;&gt;
        &lt;div class=&quot;th-input-heading&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;Input&lt;/span&gt;&lt;span&gt;Deck&lt;/span&gt;&lt;span&gt;Signal&lt;/span&gt;&lt;span&gt;State&lt;/span&gt;&lt;span&gt;File&lt;/span&gt;&lt;span style=&quot;text-align:right&quot;&gt;Remaining&lt;/span&gt;&lt;/div&gt;
        ${state.channels.map((c,i)=&gt;{
          const [label,tone]=status(c),j=c.job;
          const remain=j?.state===&#x27;recording&#x27;?timer(j.duration-j.recorded):j?.state===&#x27;prepared&#x27;?timer(j.duration):j?.state===&#x27;waiting&#x27;?&#x27;Waiting&#x27;:&#x27;—&#x27;;
          return `&lt;button type=&quot;button&quot; class=&quot;th-input-row cursor-interaction&quot; data-action=&quot;select-channel&quot; data-channel=&quot;${i}&quot; aria-pressed=&quot;${state.selected===i}&quot; aria-label=&quot;Channel ${c.id}, ${escape(c.deck)}, ${label}&quot;&gt;
            &lt;span class=&quot;th-num&quot;&gt;${String(c.id).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;${escape(c.deck)}&lt;/span&gt;&lt;span class=&quot;th-small&quot;&gt;${c.signal===&#x27;nosignal&#x27;?&#x27;No SDI&#x27;:escape(c.format)}&lt;/span&gt;&lt;span&gt;${tag(label,tone)}&lt;/span&gt;&lt;span class=&quot;th-input-filename&quot;&gt;${escape(j?.name||&#x27;—&#x27;)}&lt;/span&gt;&lt;span class=&quot;th-input-remaining th-num&quot;&gt;${remain}&lt;/span&gt;
          &lt;/button&gt;`;
        }).join(&#x27;&#x27;)}
      &lt;/section&gt;`;
    }
    function channelView() {
      const c=selected();
      const monitor=layout===&#x27;console&#x27;
        ? `&lt;section class=&quot;th-monitor-block&quot; aria-label=&quot;Selected SDI input&quot;&gt;&lt;div class=&quot;th-monitor-heading&quot;&gt;&lt;strong&gt;Input ${String(c.id).padStart(2,&#x27;0&#x27;)} · ${escape(c.deck)}&lt;/strong&gt;&lt;span class=&quot;th-small&quot;&gt;SDI ${escape(c.port)}&lt;/span&gt;&lt;/div&gt;${feed(c,true)}${scopePanel()}&lt;/section&gt;`
        : `&lt;section class=&quot;th-monitor-block&quot; aria-label=&quot;All SDI inputs&quot;&gt;&lt;div class=&quot;th-channel-grid&quot;&gt;${state.channels.map((c,i)=&gt;channelCard(c,i)).join(&#x27;&#x27;)}&lt;/div&gt;${scopePanel()}&lt;/section&gt;`;
      return `&lt;div class=&quot;th-console-title&quot;&gt;&lt;h1&gt;${layout===&#x27;console&#x27;?&#x27;Inputs&#x27;:&#x27;Input monitors&#x27;}&lt;/h1&gt;&lt;span class=&quot;th-small&quot;&gt;DeckLink Duo 2 / Card A · 4 SDI inputs&lt;/span&gt;&lt;/div&gt;
        ${layout===&#x27;console&#x27;?inputRows():&#x27;&#x27;}
        &lt;div class=&quot;th-capture-grid&quot;&gt;${monitor}${captureEditor()}&lt;/div&gt;
        ${demoControls()}`;
    }
    function queueView() {
      scheduleQueue();
      const running=state.queue.filter(q=&gt;[&#x27;copying&#x27;,&#x27;verifying&#x27;].includes(q.state)), pending=state.queue.filter(q=&gt;q.state!==&#x27;delivered&#x27;);
      const rate=running.reduce((n,q)=&gt;n+q.rate,0);
      return `&lt;div class=&quot;th-title-row&quot;&gt;&lt;div class=&quot;th-title-copy&quot;&gt;&lt;span class=&quot;th-label&quot;&gt;Local cache → station archive&lt;/span&gt;&lt;h1&gt;Delivery queue&lt;/h1&gt;&lt;p class=&quot;th-small&quot;&gt;Transfer status and delivery schedule.&lt;/p&gt;&lt;/div&gt;${button(`${icon(&#x27;settings-2&#x27;)} Transfer settings`,&#x27;queue-settings&#x27;)}&lt;/div&gt;&lt;div class=&quot;th-window&quot;&gt;&lt;div class=&quot;th-window-copy&quot;&gt;&lt;div class=&quot;th-row&quot;&gt;${tag(state.windowOpen?&#x27;Window open&#x27;:activeOverride()?&#x27;Override active&#x27;:&#x27;Outside transfer window&#x27;,state.windowOpen||activeOverride()?&#x27;ready&#x27;:&#x27;waiting&#x27;)}&lt;strong class=&quot;th-num&quot;&gt;${escape(state.settings.start)}–${escape(state.settings.end)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;th-small&quot;&gt;Every day · America/Chicago · ${state.settings.concurrency} transfers · ${state.settings.rate} MiB/s each&lt;/div&gt;&lt;div class=&quot;th-small&quot;&gt;${activeOverride()?`Override ends in ${timer(state.overrideUntil-state.elapsed)}.`:`Existing transfers continue at ${state.settings.outRate} MiB/s each outside the window.`}&lt;/div&gt;&lt;/div&gt;${button(activeOverride()?`${icon(&#x27;clock-3&#x27;)} End override now`:`${icon(&#x27;clock-3&#x27;)} Override for 12 hours`,&#x27;global-override&#x27;,activeOverride()?&#x27;&#x27;:&#x27;th-primary&#x27;)}&lt;/div&gt;&lt;div class=&quot;th-summary&quot;&gt;&lt;div class=&quot;th-summary-item&quot;&gt;&lt;span class=&quot;th-small&quot;&gt;Active deliveries&lt;/span&gt;&lt;span class=&quot;th-value th-num&quot;&gt;${running.length} &lt;span class=&quot;th-small&quot;&gt;/ ${state.settings.concurrency}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-summary-item&quot;&gt;&lt;span class=&quot;th-small&quot;&gt;Current payload rate&lt;/span&gt;&lt;span class=&quot;th-value th-num&quot;&gt;${rate.toFixed(1)} &lt;span class=&quot;th-small&quot;&gt;MiB/s&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-summary-item&quot;&gt;&lt;span class=&quot;th-small&quot;&gt;Still to copy&lt;/span&gt;&lt;span class=&quot;th-value th-num&quot;&gt;${shortBytes(pending.reduce((n,q)=&gt;n+q.size-q.copied,0))}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;th-panel&quot;&gt;&lt;div class=&quot;th-panel-head&quot;&gt;&lt;div class=&quot;th-row th-between&quot;&gt;&lt;h2&gt;Recording packages&lt;/h2&gt;&lt;span class=&quot;th-small&quot;&gt;Media + metadata + checksums&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;th-queue-list&quot;&gt;${state.queue.map(q=&gt;{
        const copying=q.state===&#x27;copying&#x27;,verifying=q.state===&#x27;verifying&#x27;,done=q.state===&#x27;delivered&#x27;,held=q.state===&#x27;held&#x27;;
        const label=done?&#x27;Delivered&#x27;:held?(q.review?&#x27;Needs review&#x27;:&#x27;Held&#x27;):verifying?&#x27;Verifying&#x27;:copying?&#x27;Copying&#x27;:q.override?&#x27;Override queued&#x27;:&#x27;Queued&#x27;;
        const caption=done?&#x27;Destination SHA-256 verified&#x27;:held?(q.review?&#x27;QC review required before delivery&#x27;:&#x27;Held by operator&#x27;):verifying?`${Math.round(q.verified/q.size*100)}% destination verification`:copying?`${shortBytes(q.copied)} of ${shortBytes(q.size)}`:allowed(q)?&#x27;Waiting for a transfer slot&#x27;:&#x27;Waiting for transfer window&#x27;;
        return `&lt;div class=&quot;th-queue-row&quot;&gt;&lt;div&gt;&lt;div class=&quot;th-queue-name&quot;&gt;${escape(q.name)}&lt;/div&gt;&lt;div class=&quot;th-small&quot;&gt;${escape(q.station)} · ${shortBytes(q.size)} · ${escape(q.folder)}&lt;/div&gt;&lt;div style=&quot;margin-top:9px&quot;&gt;${progress(done?100:verifying?q.verified/q.size*100:q.copied/q.size*100,`${q.name} ${verifying?&#x27;verification&#x27;:&#x27;copy&#x27;} progress`)}&lt;/div&gt;&lt;div class=&quot;th-queue-caption&quot;&gt;&lt;span class=&quot;th-small&quot;&gt;${caption}&lt;/span&gt;${q.override?&#x27;&lt;span class=&quot;th-small&quot;&gt;File override&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;th-queue-status&quot;&gt;${tag(label,done?&#x27;delivered&#x27;:held?&#x27;review&#x27;:q.state)}&lt;span class=&quot;th-rate-label th-num&quot;&gt;${copying||verifying?`${q.rate.toFixed(1)} MiB/s`:done?&#x27;Retained locally&#x27;:&#x27;—&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-queue-actions&quot;&gt;${done?&#x27;&lt;span class=&quot;th-small&quot;&gt;Copy verified&lt;/span&gt;&#x27;:held&amp;&amp;q.review?button(&#x27;Review QC&#x27;,&#x27;review-job&#x27;,&#x27;&#x27;,`data-job=&quot;${escape(q.id)}&quot;`):`${button(q.override?&#x27;Cancel override&#x27;:&#x27;Transfer now&#x27;,&#x27;file-override&#x27;,q.override?&#x27;&#x27;:&#x27;th-primary&#x27;,`data-job=&quot;${escape(q.id)}&quot;`)}${button(held?&#x27;Resume&#x27;:copying||verifying?&#x27;Pause&#x27;:&#x27;Hold&#x27;,&#x27;hold-job&#x27;,&#x27;th-quiet&#x27;,`data-job=&quot;${escape(q.id)}&quot;`)}`}&lt;/div&gt;&lt;/div&gt;`;
      }).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;th-note&quot;&gt;${icon(&#x27;shield-check&#x27;)}&lt;span&gt;A delivery is complete after destination verification. Local copies remain available for the retention period.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-demo&quot;&gt;&lt;div class=&quot;th-row&quot;&gt;&lt;span class=&quot;th-demo-label&quot;&gt;Simulation controls&lt;/span&gt;&lt;label class=&quot;th-row th-small&quot;&gt;Transfer window &lt;select aria-label=&quot;Simulated transfer window&quot; data-field=&quot;windowOpen&quot;&gt;&lt;option value=&quot;closed&quot; ${!state.windowOpen?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Closed&lt;/option&gt;&lt;option value=&quot;open&quot; ${state.windowOpen?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Open&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;th-row&quot;&gt;&lt;select aria-label=&quot;Simulation time step&quot; data-field=&quot;step&quot;&gt;${[[120,&#x27;2 minutes&#x27;],[600,&#x27;10 minutes&#x27;],[43200,&#x27;12 hours&#x27;]].map(([v,t])=&gt;`&lt;option value=&quot;${v}&quot; ${state.step===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${t}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;${button(`${icon(&#x27;fast-forward&#x27;)} Advance`,&#x27;advance&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
    }
    function qcView() {
      const q=state.queue.find(q=&gt;q.review)||state.queue.find(q=&gt;q.id===state.reviewJob)||state.queue[0];
      const reviewed=!q?.review;
      return `&lt;div class=&quot;th-title-row&quot;&gt;&lt;div class=&quot;th-title-copy&quot;&gt;&lt;span class=&quot;th-label&quot;&gt;Recording quality control&lt;/span&gt;&lt;h1&gt;Review the recording&lt;/h1&gt;&lt;p class=&quot;th-small&quot;&gt;Picture, source metrics, and capture events in one place.&lt;/p&gt;&lt;/div&gt;${tag(reviewed?&#x27;Reviewed&#x27;:&#x27;Needs review&#x27;,reviewed?&#x27;ready&#x27;:&#x27;review&#x27;)}&lt;/div&gt;&lt;section class=&quot;th-panel&quot;&gt;&lt;div class=&quot;th-panel-head&quot;&gt;&lt;h2 style=&quot;overflow-wrap:anywhere&quot;&gt;${escape(q?.name||&#x27;Reference recording&#x27;)}&lt;/h2&gt;&lt;span class=&quot;th-small&quot;&gt;FFV1 · 10-bit 4:2:2 · 48 kHz PCM · preservation master&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-qc-layout th-qc-preview&quot;&gt;&lt;div class=&quot;th-stack&quot;&gt;${feed({id:1,signal:&#x27;program&#x27;,draft:{station:q?.station||&#x27;KGAN&#x27;}},true)}&lt;div class=&quot;th-row th-between&quot;&gt;&lt;span class=&quot;th-small th-num&quot;&gt;00:42:18 / 01:00:00&lt;/span&gt;&lt;span class=&quot;th-small&quot;&gt;Illustrative review frame&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-timeline&quot;&gt;&lt;canvas data-qc-timeline role=&quot;img&quot; aria-label=&quot;Illustrative luma levels over a 60-minute recording, with black intervals near the end&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;th-row&quot;&gt;&lt;span class=&quot;th-tag&quot;&gt;Luma average&lt;/span&gt;&lt;span class=&quot;th-tag&quot; data-tone=&quot;review&quot;&gt;Black + silence&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;${scopePanel()}&lt;/div&gt;&lt;div class=&quot;th-stack&quot;&gt;&lt;h3&gt;Capture checks&lt;/h3&gt;&lt;div class=&quot;th-job-meta&quot;&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span&gt;Container and streams&lt;/span&gt;&lt;span style=&quot;color:var(--th-accent)&quot;&gt;Passed&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span&gt;Dropped frames reported&lt;/span&gt;&lt;span class=&quot;th-num&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span&gt;Local SHA-256&lt;/span&gt;&lt;span style=&quot;color:var(--th-accent)&quot;&gt;Recorded&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span&gt;Source timecode&lt;/span&gt;&lt;span&gt;2 discontinuities&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;th-divider&quot;&gt;&lt;/div&gt;&lt;h3&gt;Review markers&lt;/h3&gt;&lt;div class=&quot;th-events&quot;&gt;&lt;div class=&quot;th-event&quot;&gt;&lt;span class=&quot;th-small th-num&quot;&gt;00:18:42&lt;/span&gt;&lt;strong&gt;Timecode discontinuity&lt;/strong&gt;&lt;span class=&quot;th-small&quot;&gt;Picture and audio capture continued.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-event&quot;&gt;&lt;span class=&quot;th-small th-num&quot;&gt;00:42:18–00:44:34&lt;/span&gt;&lt;strong&gt;Extended black + silence&lt;/strong&gt;&lt;span class=&quot;th-small&quot;&gt;Check whether this is intentional content or blank tape.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-event&quot;&gt;&lt;span class=&quot;th-small th-num&quot;&gt;00:59:12&lt;/span&gt;&lt;strong&gt;Vertical repetition indicator&lt;/strong&gt;&lt;span class=&quot;th-small&quot;&gt;Review the source picture. The metric alone is not a diagnosis.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;${reviewed?&#x27;&lt;div class=&quot;th-note&quot; data-tone=&quot;success&quot;&gt;Operator review complete. Delivery follows the queue policy.&lt;/div&gt;&#x27;:button(`${icon(&#x27;check&#x27;)} Mark reviewed and release`,&#x27;release-qc&#x27;,&#x27;th-primary&#x27;,`data-job=&quot;${escape(q?.id)}&quot;`)}${button(`${icon(&#x27;file-chart-column&#x27;)} QCTools report details`,&#x27;qc-details&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;
    }
    function reportView() {

t;checkbox&quot; data-field=&quot;settings.dailyReport&quot; ${state.settings.dailyReport?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;th-row th-between&quot;&gt;&lt;h2&gt;Report history&lt;/h2&gt;${button(&#x27;Preview current summary&#x27;,&#x27;preview-summary&#x27;,&#x27;th-primary&#x27;)}&lt;/div&gt;&lt;div class=&quot;th-reports&quot;&gt;${state.reports.slice(0,5).map(r=&gt;`&lt;section class=&quot;th-panel th-report&quot;&gt;&lt;div class=&quot;th-stack&quot; style=&quot;gap:5px&quot;&gt;&lt;span class=&quot;th-label&quot;&gt;${escape(r.type)}&lt;/span&gt;&lt;h3&gt;${escape(r.title)}&lt;/h3&gt;&lt;p class=&quot;th-small&quot;&gt;${escape(r.detail)}&lt;/p&gt;&lt;/div&gt;${button(&#x27;Preview email&#x27;,&#x27;preview-summary&#x27;)}&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;th-note&quot;&gt;${icon(&#x27;bell&#x27;)}&lt;span&gt;Capture failures, unsafe disk space, signal loss, and verification failures can generate immediate alerts. Repeated alerts are grouped.&lt;/span&gt;&lt;/div&gt;`;
    }
    function recordingFieldsPanel() {

    function settingsView() {

de&lt;/span&gt;&lt;span&gt;12 elapsed hours&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span class=&quot;th-muted&quot;&gt;File override&lt;/span&gt;&lt;span&gt;Until delivery completes&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-meta-row&quot;&gt;&lt;span class=&quot;th-muted&quot;&gt;Local retention&lt;/span&gt;&lt;span&gt;7 days after verification&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;
      else if(state.settingsTab===&#x27;io&#x27;) body=`&lt;section class=&quot;th-panel&quot;&gt;&lt;div class=&quot;th-panel-head&quot;&gt;&lt;h2&gt;DeckLink Duo 2 · Card A&lt;/h2&gt;&lt;span class=&quot;th-small&quot;&gt;Four SDI connections · assignments are illustrative&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;th-panel-body&quot;&gt;${state.channels.map((c,i)=&gt;`&lt;div class=&quot;th-fields-two&quot;&gt;${input(`Channel ${c.id} · deck name`,`mapping.${i}.deck`,c.deck,&#x27;text&#x27;,`${[&#x27;recording&#x27;,&#x27;waiting&#x27;,&#x27;prepared&#x27;].includes(c.job?.state)?&#x27;readonly&#x27;:&#x27;&#x27;} maxlength=&quot;50&quot;`)}&lt;label class=&quot;th-field&quot;&gt;&lt;span&gt;Physical input&lt;/span&gt;&lt;select data-mapping-port=&quot;${i}&quot; ${[&#x27;recording&#x27;,&#x27;waiting&#x27;,&#x27;prepared&#x27;].includes(c.job?.state)?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${[&#x27;1&#x27;,&#x27;2&#x27;,&#x27;3&#x27;,&#x27;4&#x27;].map(v=&gt;`&lt;option value=&quot;${v}&quot; ${c.port===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Card A / SDI ${v}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;th-note&quot;&gt;${icon(&#x27;lock-keyhole&#x27;)}&lt;span&gt;Inputs reserved by recording or armed jobs are locked. Idle assignments can be changed together.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;

    }
