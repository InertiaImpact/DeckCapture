      const candidates=state.queue.filter(q=>q.state==='queued'&&!q.hold&&allowed(q)).sort((a,b)=>Number(b.override)-Number(a.override));
      for(const q of candidates) if(slots>0) {q.state=q.copied>=q.size?'verifying':'copying'; slots--;}
      const running=state.queue.filter(q=>['copying','verifying'].includes(q.state));
      for(const q of state.queue) q.rate=0;

      let pending=running.slice();

    function drawCanvases() {
      const scopeSignal = state.view === 'qc' ? 'program' : selected().signal;
      const css=getComputedStyle(el), ink=css.getPropertyValue('--th-text').trim(), muted=css.getPropertyValue('--th-muted').trim();
      const color=name=>{const probe=document.createElement('span');probe.style.color=`var(${name})`;el.appendChild(probe);const c=getComputedStyle(probe).color;probe.remove();return c;};
      const line=color('--th-line'), fg=color('--th-muted'), accent=color('--th-scope-trace'), warn=color('--th-warn');
      el.querySelectorAll('canvas').forEach(canvas=>{
        const width=Math.round(canvas.getBoundingClientRect().width);if(width<10)return;
        const height=canvas.hasAttribute('data-qc-timeline')?145:135;
        const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;
        const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.font='11px Segoe UI, sans-serif';ctx.lineWidth=1;
        const left=36,right=width-12,top=25,bottom=height-27;
        ctx.fillStyle=fg;ctx.strokeStyle=line;
        const timeline=canvas.hasAttribute('data-qc-timeline');
        if(!timeline && state.scope==='vectorscope') {
          const cx=width/2,cy=height/2,r=Math.min(width/2-32,height/2-22);
          ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-r-10,cy);ctx.lineTo(cx+r+10,cy);ctx.moveTo(cx,cy-r-5);ctx.lineTo(cx,cy+r+5);ctx.stroke();
          ctx.fillText('U',cx+r+12,cy+3);ctx.fillText('V',cx-3,cy-r-7);
          ctx.fillStyle=accent;
          if(scopeSignal==='program')for(let k=0;k<180;k++){const a=k*.61;const rr=(.15+.19*(Math.sin(k*1.8)+1))*r;ctx.fillRect(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,1.5,1.5);}
          else {ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);ctx.fill();}
          return;
        }
        [0,50,100].forEach(v=>{const y=bottom-v/100*(bottom-top);ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillStyle=fg;ctx.textAlign='right';ctx.fillText(String(v),left-7,y+4);});
        ctx.textAlign='left';ctx.fillStyle=fg;ctx.fillText(timeline?'Luma %':state.scope==='audio'?'Level %':'Luma %',4,10);
        if(!timeline && state.scope==='audio') {
          const w=(right-left)/8;
          for(let n=0;n<8;n++){const value=scopeSignal==='program'?(n<2?68+10*Math.sin(state.elapsed+n):n<4?35:2):1;ctx.fillStyle=line;ctx.fillRect(left+n*w+3,top,w-9,bottom-top);ctx.fillStyle=accent;ctx.fillRect(left+n*w+3,bottom-value/100*(bottom-top),w-9,value/100*(bottom-top));ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText(String(n+1),left+n*w+w/2,height-10);}
          ctx.textAlign='right';ctx.fillText('Track',right,height-1);return;
        }
        ctx.strokeStyle=accent;ctx.lineWidth=1.4;ctx.beginPath();
        const n=Math.max(50,Math.floor(right-left));
        for(let i=0;i<=n;i++) {const x=left+i/n*(right-left),ratioX=i/n;let value;
          if(timeline)value=ratioX>.70&&ratioX<.76?2:42+12*Math.sin(i*.14)+8*Math.sin(i*.47);
          else value=scopeSignal==='program'?45+23*Math.sin(i*.11)+13*Math.sin(i*.37)+4*Math.sin(i*2):scopeSignal==='black'?2:0;
          const y=bottom-value/100*(bottom-top);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }ctx.stroke();ctx.fillStyle=fg;ctx.textAlign='left';ctx.fillText('0',left,height-10);ctx.textAlign='center';ctx.fillText(timeline?'30 min':'Picture samples',(left+right)/2,height-10);ctx.textAlign='right';ctx.fillText(timeline?'60 min':'100%',right,height-10);
        if(timeline){ctx.fillStyle=warn;ctx.fillRect(left+(right-left)*.70,top,Math.max(5,(right-left)*.06),4);}
      });
    }
    function validateSettings(s) {

      const c=selected(),d=c.draft;
      if(c.signal==='nosignal') {notify('No valid SDI input. Restore the signal before preparing this channel.',true);render();return;}
      if(!d.name.trim()||/[<>:"/\\|?*]/.test(d.name)||/[ .]$/.test(d.name)||/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)/i.test(d.name)) {notify('Enter a file name without reserved Windows characters or device names.',true);render();return;}
      if(!Number.isFinite(Number(d.duration))||d.duration<1||d.duration>720) {notify('Choose a duration between 1 and 720 minutes.',true);render();return;}
      if(state.queue.some(q=>q.name===d.name+'.mkv'||q.name===d.name+'.mov')) {notify('This file name already exists in the delivery queue. Choose a unique name.',true);render();return;}
      const s=state.settings;
      const values={...d};
      metadataFields.forEach(([key])=>{if(!s.metadataVisibility[key]||!String(values[key]||'').trim())delete values[key];});
      c.job={...values,name:d.name.trim(),state:wait?'waiting':'prepared',duration:Number(d.duration)*60,recorded:0,waited:0,waitMax:s.waitMax,preRoll:wait?s.preRoll:0,experimentalEndDetection:s.experimentalEndDetection,fieldVisibility:{...s.metadataVisibility},endMode:s.experimentalEndDetection?d.endMode:'off',blackSeconds:s.blackSeconds,minRecord:s.minRecord,grace:s.grace,blackRun:0,warning:false,graceLeft:null};
      c.changedAt=state.elapsed;
      if(wait && c.signal==='program')c.requireTransition=true;
      notify(wait?'Saved and armed. Change the simulated input to content, then advance 2 seconds.':'Job prepared. Press START RECORDING when the tape is ready.');
      render();persist(app);
    }
    el.addEventListener('input',event=>{
      const f=event.target.closest('[data-field]');if(!f)return;
      const field=f.dataset.field;
      if(field.startsWith('draft.'))selected().draft[field.split('.')[1]]=f.type==='number'?Number(f.value):f.value;
    });
    el.addEventListener('change',event=>{
      const f=event.target.closest('[data-field]');if(!f)return;
      const field=f.dataset.field;
      if(field==='signal') {const c=selected();c.signal=f.value;c.changedAt=state.elapsed;if(c.signal==='nosignal'){c.format='Awaiting SDI';c.requireTransition=false;if(c.job?.state==='recording')c.job.warning=true;notify(`Channel ${c.id}: simulated input loss.`);}else {c.format='525i / 59.94';if(c.signal!=='program')c.requireTransition=false;notify(c.signal==='program'?'Program content is present. Advance time to confirm the trigger.':'Black picture and silent audio are present.');}render();persist(app);}
      else if(field==='windowOpen') {const was=state.windowOpen;state.windowOpen=f.value==='open';if(was&&!state.windowOpen&&state.settings.windowReport)state.reports.unshift({id:`window-${state.elapsed}-${state.reports.length}`,title:'Transfer window closed',type:'Window summary',detail:`${state.queue.filter(q=>q.state==='delivered').length} delivered · ${state.queue.filter(q=>['copying','verifying'].includes(q.state)).length} still running · remaining jobs deferred`,status:'Preview available'});scheduleQueue();notify(state.windowOpen?'Transfer window opened. Eligible queued packages can start.':'Transfer window closed. Active deliveries continue at the outside-window rate.');render();persist(app);}
      else if(field==='step') {state.step=Number(f.value);persist(app);}
      else if(field==='settings.experimentalEndDetection'&&state.view==='settings'){const panel=el.querySelector('[data-experimental-panel]');if(panel)panel.hidden=!f.checked;}
      else if(field.startsWith('draft.')) {if(field==='draft.duration') {el.querySelectorAll('[data-action="preset"]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.minutes)===selected().draft.duration)));}else if(field==='draft.destination'||field==='draft.profile'||field==='draft.endMode')render();persist(app);}
      else if(field.startsWith('settings.')&&state.view==='reports'){state.settings[field.split('.')[1]]=f.checked;persist(app);}
    });
    el.addEventListener('submit',e=>{e.preventDefault();if(e.target.hasAttribute('data-recording-form'))prepare(false);});
    el.addEventListener('click',event=>{
      const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
      const a=b.dataset.action,c=selected(),j=c.job;
      if(a==='view'){state.view=b.dataset.view;state.modal=null;state.toast='';}
      else if(a==='select-channel'){state.selected=Number(b.dataset.channel);state.toast='';state.modal=null;}
      else if(a==='scope')state.scope=b.dataset.scope;
      else if(a==='preset'){c.draft.duration=Number(b.dataset.minutes);}
      else if(a==='prepare'){prepare(false);return;}
      else if(a==='arm'){prepare(true);return;}
      else if(a==='start'){if(c.signal==='nosignal'){notify('Restore SDI input before starting.',true);}else if(j&&['prepared','waiting'].includes(j.state)){j.state='recording';j.waited=0;j.recorded=0;j.blackRun=0;c.requireTransition=false;notify(`Channel ${c.id} is recording to local cache.`);}}
      else if(a==='stop'){finish(c,'Operator stopped');scheduleQueue();notify('Recording finalized locally. The delivery package follows its queue policy.');}
      else if(a==='add-time'){if(j?.state==='recording'){j.duration+=300;notify('Added five minutes to this recording.');}}
      else if(a==='cancel-wait'){if(j){j.state='prepared';j.preRoll=0;notify('Waiting canceled. The job is ready for manual start.');}}
      else if(a==='edit-job'){if(j?.state==='prepared'){c.draft={...c.draft,name:j.name,operator:j.operator,duration:j.duration/60};c.job=null;}}
      else if(a==='next-tape'){c.job=null;c.draft.name=c.draft.name+'_NEXT';notify('Ready to prepare the next tape.');}
      else if(a==='advance'){advance(state.step);return;}
      else if(a==='browse')state.modal={type:'folder',folder:c.draft.folder};
      else if(a==='choose-folder'){state.modal.folder=b.dataset.folder;}
      else if(a==='use-folder'){c.draft.folder=state.modal.folder;state.modal=null;notify('Archive folder selected. The recording will still be cached locally.');}
      else if(a==='close-modal')state.modal=null;
      else if(a==='global-override'){state.overrideUntil=activeOverride()?null:state.elapsed+43200;scheduleQueue();notify(activeOverride()?'Schedule overridden for 12 elapsed hours. Bandwidth and verification limits remain active.':'Override ended. Existing deliveries now follow the current window speed.');}
      else if(a==='file-override'){const q=state.queue.find(x=>x.id===b.dataset.job);if(q&&!q.hold){q.override=!q.override;scheduleQueue();notify(q.override?'File override enabled for this package and its required sidecars.':'File override canceled. This delivery follows the current window speed.');}}
      else if(a==='hold-job'){const q=state.queue.find(x=>x.id===b.dataset.job);if(q){if(q.state==='held'){q.hold=false;q.state='queued';}else {q.hold=true;q.state='held';q.rate=0;}scheduleQueue();notify(q.hold?'Delivery paused by operator. Partial progress is retained.':'Delivery released to the scheduling policy.');}}
      else if(a==='review-job'){state.reviewJob=b.dataset.job;state.view='qc';state.toast='';}
      else if(a==='release-qc'){const q=state.queue.find(x=>x.id===b.dataset.job);if(q){state.reviewJob=q.id;q.review=false;q.hold=false;q.state='queued';scheduleQueue();notify('Review recorded. The package is eligible for its delivery schedule.');}}
      else if(a==='qc-details')state.modal={type:'qc'};
      else if(a==='preview-summary')state.modal={type:'summary'};
      else if(a==='preview-test')state.modal={type:'test'};
      else if(a==='queue-settings'){state.view='settings';state.settingsTab='delivery';state.toast='';}
      else if(a==='email-settings'){state.view='settings';state.settingsTab='email';state.toast='';}
      else if(a==='settings-tab'){state.settingsTab=b.dataset.tab;state.toast='';state.modal=null;}
      else if(a==='save-settings'){
        const next=readSettings(),err=validateSettings(next);
        const ports=Array.from(el.querySelectorAll('[data-mapping-port]')).map(f=>f.value);
        if(err){notify(err,true);}else if(ports.length&&new Set(ports).size!==ports.length){notify('Each idle channel needs a unique physical SDI input. Change both assignments before saving.',true);}else {
          state.settings=next;
          applyExperimentalDisable();
          el.querySelectorAll('[data-mapping-port]').forEach(f=>{state.channels[Number(f.dataset.mappingPort)].port=f.value;});
          el.querySelectorAll('[data-field^="mapping."]').forEach(f=>{if(!f.readOnly)state.channels[Number(f.dataset.field.split('.')[1])].deck=f.value;});
          state.channels.filter(x=>!x.job).forEach(x=>x.draft.endMode=next.endMode);
          scheduleQueue();notify('Settings saved. Hidden fields are omitted from new jobs; disabling experimental end detection cancels pending stops.');
        }
      }
      else if(a==='export')state.modal={type:'export',text:JSON.stringify(exportConfig(),null,2)};
      else if(a==='import')state.modal={type:'import',text:JSON.stringify(exportConfig(),null,2)};
      else if(a==='apply-import'){
        try {
          state.modal.text=el.querySelector('[data-json]').value;
          const data=JSON.parse(state.modal.text);
          if(data.schemaVersion!==1||data.previewOnly!==true)throw new Error('Use a version 1 DeckCapture preview export.');
          const d=data.delivery,n={...state.settings,start:d.startLocal,end:d.endLocal,concurrency:d.maximumConcurrentTransfers,rate:d.perTransferMiBps,outRate:d.outsideWindowPerTransferMiBps,aggregate:d.aggregateMiBps,durations:data.durationPresetsMinutes.join(', '),metadataVisibility:{...state.settings.metadataVisibility},experimentalEndDetection:false};
          const err=validateSettings(n);if(err)throw new Error(err);
          if(data.detection){const det=data.detection;if(!['off','alert','stop'].includes(det.endMode)||![det.blackSeconds,det.minimumRecordedSeconds,det.graceSeconds,det.preRollSeconds].every(Number.isFinite)||det.blackSeconds<10||det.blackSeconds>600||det.minimumRecordedSeconds<0||det.minimumRecordedSeconds>3600||det.graceSeconds<5||det.graceSeconds>120||det.preRollSeconds<0||det.preRollSeconds>15)throw new Error('Detection settings are outside the supported preview limits.');Object.assign(n,{endMode:det.endMode,blackSeconds:det.blackSeconds,minRecord:det.minimumRecordedSeconds,grace:det.graceSeconds,preRoll:det.preRollSeconds});}
          if(data.reports)Object.assign(n,{batchReport:!!data.reports.captureGroupComplete,windowReport:!!data.reports.transferWindowClosed,dailyReport:!!data.reports.dailyDigest});
          if(data.experimentalFeatures){const enabled=data.experimentalFeatures.endOfTapeDetection?.enabled;if(typeof enabled!=='boolean')throw new Error('Experimental end detection must be enabled or disabled explicitly.');n.experimentalEndDetection=enabled;}
          if(data.metadataFields){for(const [key] of metadataFields){const field=data.metadataFields[key];if(!field||typeof field.visible!=='boolean')throw new Error('Each metadata field needs a visible setting.');if(field.required===true)throw new Error('This preview supports optional descriptive fields only. Hidden fields cannot be required.');n.metadataVisibility[key]=field.visible;}}
          state.settings=n;applyExperimentalDisable();state.modal=null;scheduleQueue();notify('Configuration applied. Field visibility is saved; disabling experimental end detection cancels pending heuristic stops.');
        }catch(err){notify(`Import was not applied. ${err.message}`,true);}
      }
      render();persist(app);
      if(state.modal)el.querySelector('.th-modal button, .th-modal textarea')?.focus();
    });
    el.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}});
    function applyDesign(){el.style.setProperty('--th-gap',`${design.spacing}px`);el.style.setProperty('--th-preview-height',`${design.previewHeight}px`);requestAnimationFrame(drawCanvases);}
    render();
    if(globalThis.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(drawCanvases)).observe(el);
    if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:applyDesign});tweak.addSlider(design,'spacing',{label:'Workspace spacing',min:12,max:24,step:2,unit:'px',reference:'--th-gap'});tweak.addSlider(design,'previewHeight',{label:'Channel preview height',min:100,max:180,step:5,unit:'px',reference:'--th-preview-height'});}
    app.restore=v=>{if(validSaved(v)){state=v;state.modal=null;app.state=state;render();}};
  }
  createApp('th-console','console');
  createApp('th-monitors','monitors');
  window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;const incoming=data?.deckcaptureConsole;if(!incoming||data.deckcaptureConsoleEditToken===lastOutgoingToken||JSON.stringify(incoming)===lastOutgoingState)return;instances.forEach(i=>i.restore(incoming[i.id]));});
})();
</script>
